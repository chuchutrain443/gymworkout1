<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#9333ea">
    <title>Body Recomp Tracker</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        #root { min-height: 100vh; }
        input, select, textarea { font-size: 16px !important; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // All icon components inline
        const Icon = ({ d, size = 24, className = "" }) => (
            <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                {Array.isArray(d) ? d.map((path, i) => <path key={i} d={path} />) : <path d={d} />}
            </svg>
        );

        const Calendar = (props) => <Icon {...props} d={["M16 2v4M8 2v4M3 10h18", "M3 4h18a2 2 0 012 2v14a2 2 0 01-2 2H3a2 2 0 01-2-2V6a2 2 0 012-2z"]} />;
        const Dumbbell = (props) => <Icon {...props} d={["m6.5 6.5 11 11", "M21 21l-1-1", "M3 3l1 1", "M18 22l4-4", "M2 6l4-4", "M3 10l7-7", "M14 21l7-7"]} />;
        const Pill = (props) => <Icon {...props} d={["m10.5 20.5 10-10a4.95 4.95 0 10-7-7l-10 10a4.95 4.95 0 107 7z", "m8.5 8.5 7 7"]} />;
        const TrendingUp = (props) => <Icon {...props} d={["M23 6L13.5 15.5 8.5 10.5 1 18", "M17 6h6v6"]} />;
        const Check = (props) => <Icon {...props} d="M20 6L9 17l-5-5" />;
        const Plus = (props) => <Icon {...props} d={["M12 5v14", "M5 12h14"]} />;
        const X = (props) => <Icon {...props} d={["M18 6L6 18", "M6 6l12 12"]} />;
        const Award = (props) => <Icon {...props} d={["M12 2a6 6 0 100 12 6 6 0 000-12z", "M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"]} />;
        const Download = (props) => <Icon {...props} d={["M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4", "M7 10l5 5 5-5", "M12 15V3"]} />;
        const Edit3 = (props) => <Icon {...props} d={["M12 20h9", "M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"]} />;
        const Save = (props) => <Icon {...props} d={["M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z", "M17 21v-8H7v8", "M7 3v5h8"]} />;
        const Clock = (props) => <Icon {...props} d={["M12 2a10 10 0 100 20 10 10 0 000-20z", "M12 6v6l4 2"]} />;
        const BarChart3 = (props) => <Icon {...props} d={["M3 3v18h18", "M18 17V9", "M13 17V5", "M8 17v-3"]} />;
        const Settings = (props) => <Icon {...props} d={["M12 2a10 10 0 100 20 10 10 0 000-20z", "M12 8a4 4 0 100 8 4 4 0 000-8z"]} />;
        const RefreshCw = (props) => <Icon {...props} d={["M21 2v6h-6", "M3 12a9 9 0 0115-6.7L21 8", "M3 22v-6h6", "M21 12a9 9 0 01-15 6.7L3 16"]} />;

        // Cycle calculation
        const getCycleInfo = (lastPeriodDate, cycleLength = 28) => {
            if (!lastPeriodDate) return null;
            const today = new Date();
            const lastPeriod = new Date(lastPeriodDate);
            const daysDiff = Math.floor((today - lastPeriod) / (1000 * 60 * 60 * 24));
            const cycleDay = (daysDiff % cycleLength) + 1;
            
            let phase, phaseDay, description, trainingIntensity, calories, supplements;
            
            if (cycleDay >= 1 && cycleDay <= 5) {
                phase = 'Menstrual'; phaseDay = cycleDay;
                description = 'The Reset - Lower energy initially, rebounds by Day 3-4';
                trainingIntensity = '70-85% intensity, reduce volume by 20% if needed';
                calories = '2,150-2,200 kcal';
                supplements = ['Omega-3 (3g)', 'Iron (18-25mg)', 'Magnesium (400mg)', 'Vitamin D3 (3,000 IU)'];
            } else if (cycleDay >= 6 && cycleDay <= 14) {
                phase = 'Follicular'; phaseDay = cycleDay - 5;
                description = 'The Performance Window - PEAK energy and recovery';
                trainingIntensity = '80-90% intensity, 100% volume - PUSH FOR PRS!';
                calories = '2,100-2,150 kcal';
                supplements = ['Omega-3 (2g)', 'Magnesium (300mg)', 'Vitamin D3 (3,000 IU)', 'Creatine (5g)', 'Caffeine (200-300mg pre-workout)'];
            } else if (cycleDay >= 15 && cycleDay <= 17) {
                phase = 'Ovulation'; phaseDay = cycleDay - 14;
                description = 'The Peak - MAXIMUM STRENGTH POTENTIAL';
                trainingIntensity = '85-95% intensity - GO FOR PRS!';
                calories = '2,150-2,200 kcal';
                supplements = ['Omega-3 (2g)', 'Magnesium (300mg)', 'Vitamin D3 (3,000 IU)', 'Creatine (5g)', 'Caffeine (200-300mg pre-workout)'];
            } else {
                phase = 'Luteal'; phaseDay = cycleDay - 17;
                description = cycleDay <= 24 ? 'Early Luteal - Still strong, maintain intensity' : 'Late Luteal - Reduce volume, honor cravings';
                trainingIntensity = cycleDay <= 24 ? '80-90% intensity, maintain' : '75-85% intensity, reduce volume 20-30%';
                calories = '2,200-2,300 kcal';
                supplements = ['Omega-3 (2-3g)', 'Magnesium (400-500mg)', 'Vitamin D3 (3,000 IU)', 'Vitamin B6 (50-100mg)', 'Creatine (5g)', 'Caffeine (100-150mg, reduce)'];
            }
            
            return { cycleDay, phase, phaseDay, description, trainingIntensity, calories, supplements };
        };

        // Workout plans
        const workoutPlans = {
            'Upper A': [
                { exercise: 'Barbell Bench Press', sets: 4, reps: '6-8', rest: '2 min' },
                { exercise: 'Overhead Press', sets: 3, reps: '8-10', rest: '90s' },
                { exercise: 'Incline Dumbbell Press', sets: 3, reps: '10-12', rest: '60s' },
                { exercise: 'Cable Tricep Pushdowns', sets: 3, reps: '12-15', rest: '60s' },
                { exercise: 'Lateral Raises', sets: 4, reps: '15-20', rest: '45s' },
                { exercise: 'Face Pulls', sets: 3, reps: '15-20', rest: '45s' },
                { exercise: 'Plank', sets: 3, reps: '45-60s', rest: '60s' }
            ],
            'Lower A': [
                { exercise: 'Barbell Back Squat', sets: 4, reps: '6-8', rest: '2-3 min' },
                { exercise: 'Romanian Deadlift', sets: 3, reps: '8-10', rest: '2 min' },
                { exercise: 'Bulgarian Split Squats', sets: 3, reps: '10-12/leg', rest: '90s' },
                { exercise: 'Leg Press', sets: 3, reps: '12-15', rest: '60s' },
                { exercise: 'Leg Curls', sets: 3, reps: '12-15', rest: '60s' },
                { exercise: 'Glute Bridges/Hip Thrust', sets: 4, reps: '12-15', rest: '60s' },
                { exercise: 'Calf Raises', sets: 3, reps: '15-20', rest: '45s' },
                { exercise: 'Ab Wheel Rollouts', sets: 3, reps: '10-15', rest: '60s' }
            ],
            'Upper B': [
                { exercise: 'Barbell Row', sets: 4, reps: '6-8', rest: '2 min' },
                { exercise: 'Pull-Ups/Lat Pulldown', sets: 4, reps: '8-10', rest: '90s' },
                { exercise: 'Chest-Supported Row', sets: 3, reps: '10-12', rest: '60s' },
                { exercise: 'Dumbbell Curl', sets: 3, reps: '8-10', rest: '60s' },
                { exercise: 'Hammer Curls', sets: 3, reps: '10-12', rest: '60s' },
                { exercise: 'Rear Delt Flyes', sets: 3, reps: '15-20', rest: '45s' },
                { exercise: 'Hanging Leg Raises', sets: 3, reps: '10-15', rest: '60s' }
            ],
            'Lower B': [
                { exercise: 'Conventional Deadlift', sets: 4, reps: '5-6', rest: '3 min' },
                { exercise: 'Goblet Squat', sets: 3, reps: '8-10', rest: '2 min' },
                { exercise: 'Walking Lunges', sets: 3, reps: '12/leg', rest: '90s' },
                { exercise: 'Leg Extensions', sets: 3, reps: '12-15', rest: '60s' },
                { exercise: 'Single-Leg RDL', sets: 3, reps: '10-12/leg', rest: '90s' },
                { exercise: 'Hip Thrusts', sets: 4, reps: '10-12', rest: '60s' },
                { exercise: 'Standing Calf Raises', sets: 3, reps: '12-15', rest: '45s' },
                { exercise: 'Cable Crunches', sets: 3, reps: '15-20', rest: '60s' }
            ]
        };

        const weekSchedule = [
            { day: 'Monday', workout: 'Upper A' },
            { day: 'Tuesday', workout: 'Lower A' },
            { day: 'Wednesday', workout: 'Rest' },
            { day: 'Thursday', workout: 'Upper B' },
            { day: 'Friday', workout: 'Lower B' },
            { day: 'Saturday', workout: 'Rest' },
            { day: 'Sunday', workout: 'Rest' }
        ];

        // Main App
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [lastPeriodDate, setLastPeriodDate] = useState(localStorage.getItem('lastPeriodDate') || '');
            const [weight, setWeight] = useState(localStorage.getItem('weight') || '65');
            const [weightHistory, setWeightHistory] = useState(JSON.parse(localStorage.getItem('weightHistory') || '[]'));

            const cycleInfo = getCycleInfo(lastPeriodDate);
            const today = new Date().toLocaleDateString('en-US', { weekday: 'long' });
            const todayWorkout = weekSchedule.find(d => d.day === today);

            const updateWeight = (newWeight) => {
                setWeight(newWeight);
                const today = new Date().toISOString().split('T')[0];
                const newHistory = [...weightHistory.filter(entry => entry.date !== today), { date: today, weight: parseFloat(newWeight) }];
                setWeightHistory(newHistory.sort((a, b) => new Date(a.date) - new Date(b.date)));
            };

            useEffect(() => {
                localStorage.setItem('lastPeriodDate', lastPeriodDate);
                localStorage.setItem('weight', weight);
                localStorage.setItem('weightHistory', JSON.stringify(weightHistory));
            }, [lastPeriodDate, weight, weightHistory]);

            const exportData = () => {
                const exportObj = {
                    exportDate: new Date().toISOString(),
                    lastPeriodDate,
                    currentWeight: weight,
                    weightHistory,
                    stats: { currentCycleDay: cycleInfo?.cycleDay, currentPhase: cycleInfo?.phase }
                };
                const dataStr = JSON.stringify(exportObj, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `recomp-tracker-backup-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50 p-4 pb-24">
                    <div className="max-w-2xl mx-auto">
                        <div className="text-center mb-6 pt-4">
                            <h1 className="text-3xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-2">
                                Body Recomp Tracker
                            </h1>
                            <p className="text-sm text-gray-600">Cycle-Synced Training</p>
                        </div>

                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                {cycleInfo ? (
                                    <div className="bg-gradient-to-br from-pink-50 to-purple-50 rounded-xl p-6 border-2 border-pink-200">
                                        <div className="flex items-center justify-between mb-4">
                                            <h2 className="text-2xl font-bold text-purple-900">Cycle Day {cycleInfo.cycleDay}</h2>
                                            <Calendar className="text-purple-600" size={32} />
                                        </div>
                                        <div className="space-y-3">
                                            <div>
                                                <span className="text-lg font-semibold text-purple-800">{cycleInfo.phase} Phase</span>
                                                <span className="ml-2 text-sm text-purple-600">(Day {cycleInfo.phaseDay})</span>
                                            </div>
                                            <p className="text-sm text-gray-700">{cycleInfo.description}</p>
                                            <div className="pt-3 border-t border-purple-200">
                                                <p className="text-sm font-semibold text-gray-800 mb-1">Training Today:</p>
                                                <p className="text-sm text-gray-700">{cycleInfo.trainingIntensity}</p>
                                            </div>
                                            <div className="pt-2">
                                                <p className="text-sm font-semibold text-gray-800 mb-1">Target Calories:</p>
                                                <p className="text-sm text-gray-700">{cycleInfo.calories}</p>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-yellow-50 rounded-xl p-6 border-2 border-yellow-200">
                                        <p className="text-gray-700 mb-3">Set your last period date to track your cycle</p>
                                        <input
                                            type="date"
                                            value={lastPeriodDate}
                                            onChange={(e) => setLastPeriodDate(e.target.value)}
                                            className="px-4 py-2 border-2 border-yellow-300 rounded-lg focus:outline-none focus:border-yellow-500"
                                        />
                                    </div>
                                )}

                                {todayWorkout && (
                                    <div className="bg-white rounded-xl p-6 border-2 border-gray-200 shadow-sm">
                                        <div className="flex items-center justify-between mb-4">
                                            <h2 className="text-xl font-bold text-gray-900">Today's Training</h2>
                                            <Dumbbell className="text-blue-600" size={28} />
                                        </div>
                                        {todayWorkout.workout === 'Rest' ? (
                                            <div className="text-center py-8">
                                                <p className="text-lg text-gray-600">Rest & Recovery Day</p>
                                                <p className="text-sm text-gray-500 mt-2">Optional: 20-30 min walk</p>
                                            </div>
                                        ) : (
                                            <div>
                                                <p className="text-lg font-semibold text-blue-600 mb-3">{todayWorkout.workout}</p>
                                                <button
                                                    onClick={() => setActiveTab('workout')}
                                                    className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
                                                >
                                                    Start Workout
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}

                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-white rounded-xl p-4 border-2 border-gray-200 shadow-sm">
                                        <p className="text-sm text-gray-600 mb-1">Current Weight</p>
                                        <div className="flex items-center gap-2">
                                            <input
                                                type="number"
                                                value={weight}
                                                onChange={(e) => updateWeight(e.target.value)}
                                                className="w-20 px-2 py-1 border-2 border-gray-300 rounded focus:outline-none focus:border-blue-500"
                                                step="0.1"
                                            />
                                            <span className="text-sm text-gray-600">kg</span>
                                        </div>
                                    </div>
                                    <div className="bg-white rounded-xl p-4 border-2 border-gray-200 shadow-sm">
                                        <p className="text-sm text-gray-600 mb-1">Daily Protein</p>
                                        <p className="text-2xl font-bold text-blue-600">130-145g</p>
                                        <p className="text-xs text-gray-500 mt-1">~2x bodyweight</p>
                                    </div>
                                </div>

                                {cycleInfo && (
                                    <div className="bg-gradient-to-r from-green-50 to-blue-50 rounded-xl p-4 border-2 border-green-200">
                                        <h3 className="font-semibold text-gray-900 mb-2">💡 Nutrition Goals ({cycleInfo.phase} Phase)</h3>
                                        <p className="text-sm text-gray-700 mb-2">Target: {cycleInfo.calories}</p>
                                        <div className="text-sm text-gray-600 space-y-1">
                                            <p>• Protein: 130-145g daily (priority!)</p>
                                            <p>• Carbs: 200-240g (fuel your workouts)</p>
                                            <p>• Fats: {cycleInfo.phase === 'Luteal' ? '70-80g (↑ during PMS)' : '55-65g'}</p>
                                        </div>
                                    </div>
                                )}

                                <button
                                    onClick={exportData}
                                    className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 rounded-xl font-semibold hover:from-purple-700 hover:to-pink-700 transition flex items-center justify-center gap-2 shadow-lg"
                                >
                                    <Download size={20} />
                                    Export All Data
                                </button>
                            </div>
                        )}

                        {activeTab === 'workout' && (
                            <div className="text-center py-12 bg-white rounded-xl">
                                <Dumbbell size={48} className="mx-auto text-blue-600 mb-4" />
                                <p className="text-gray-600 mb-4">Full workout tracking coming soon!</p>
                                <button 
                                    onClick={() => setActiveTab('dashboard')}
                                    className="px-6 py-2 bg-blue-600 text-white rounded-lg"
                                >
                                    Back to Dashboard
                                </button>
                            </div>
                        )}

                        {activeTab === 'supplements' && (
                            <div className="text-center py-12 bg-white rounded-xl">
                                <Pill size={48} className="mx-auto text-orange-600 mb-4" />
                                <p className="text-gray-600 mb-4">Supplement tracking coming soon!</p>
                                <button 
                                    onClick={() => setActiveTab('dashboard')}
                                    className="px-6 py-2 bg-orange-600 text-white rounded-lg"
                                >
                                    Back to Dashboard
                                </button>
                            </div>
                        )}

                        {activeTab === 'progress' && (
                            <div className="text-center py-12 bg-white rounded-xl">
                                <TrendingUp size={48} className="mx-auto text-pink-600 mb-4" />
                                <p className="text-gray-600 mb-4">Progress tracking coming soon!</p>
                                <button 
                                    onClick={() => setActiveTab('dashboard')}
                                    className="px-6 py-2 bg-pink-600 text-white rounded-lg"
                                >
                                    Back to Dashboard
                                </button>
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-gray-200 shadow-lg">
                        <div className="max-w-2xl mx-auto flex justify-around items-center py-3">
                            <button
                                onClick={() => setActiveTab('dashboard')}
                                className={`flex flex-col items-center gap-1 px-4 py-2 rounded-lg transition ${
                                    activeTab === 'dashboard' ? 'bg-purple-100 text-purple-600' : 'text-gray-600'
                                }`}
                            >
                                <TrendingUp size={24} />
                                <span className="text-xs font-semibold">Dashboard</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('workout')}
                                className={`flex flex-col items-center gap-1 px-4 py-2 rounded-lg transition ${
                                    activeTab === 'workout' ? 'bg-blue-100 text-blue-600' : 'text-gray-600'
                                }`}
                            >
                                <Dumbbell size={24} />
                                <span className="text-xs font-semibold">Workout</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('supplements')}
                                className={`flex flex-col items-center gap-1 px-4 py-2 rounded-lg transition ${
                                    activeTab === 'supplements' ? 'bg-orange-100 text-orange-600' : 'text-gray-600'
                                }`}
                            >
                                <Pill size={24} />
                                <span className="text-xs font-semibold">Supplements</span>
                            </button>
                            <button
                                onClick={() => setActiveTab('progress')}
                                className={`flex flex-col items-center gap-1 px-4 py-2 rounded-lg transition ${
                                    activeTab === 'progress' ? 'bg-pink-100 text-pink-600' : 'text-gray-600'
                                }`}
                            >
                                <Calendar size={24} />
                                <span className="text-xs font-semibold">Progress</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
