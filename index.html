<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Recomp Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .tab-active { background-color: #e0e7ff; color: #4f46e5; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50">
    <div id="app" class="max-w-2xl mx-auto p-4 pb-24"></div>

    <script>
        // Simple state management
        let state = {
            tab: 'dashboard',
            lastPeriod: localStorage.getItem('lastPeriod') || '',
            weight: localStorage.getItem('weight') || '65',
            selectedWorkout: null,
            workoutLog: JSON.parse(localStorage.getItem('workoutLog') || '{}'),
            prs: JSON.parse(localStorage.getItem('prs') || '{}'),
            timer: 0,
            timerRunning: false,
            note: '',
            editingPR: null,
            prValue: ''
        };

        const workouts = {
            'Upper A': [
                { name: 'Barbell Bench Press', sets: 4, reps: '6-8', rest: 120 },
                { name: 'Overhead Press', sets: 3, reps: '8-10', rest: 90 },
                { name: 'Incline DB Press', sets: 3, reps: '10-12', rest: 60 },
                { name: 'Tricep Pushdowns', sets: 3, reps: '12-15', rest: 60 },
                { name: 'Lateral Raises', sets: 4, reps: '15-20', rest: 45 },
                { name: 'Face Pulls', sets: 3, reps: '15-20', rest: 45 }
            ],
            'Lower A': [
                { name: 'Back Squat', sets: 4, reps: '6-8', rest: 180 },
                { name: 'Romanian Deadlift', sets: 3, reps: '8-10', rest: 120 },
                { name: 'Bulgarian Split Squats', sets: 3, reps: '10-12', rest: 90 },
                { name: 'Leg Press', sets: 3, reps: '12-15', rest: 60 },
                { name: 'Glute Bridges', sets: 4, reps: '12-15', rest: 60 },
                { name: 'Calf Raises', sets: 3, reps: '15-20', rest: 45 }
            ],
            'Upper B': [
                { name: 'Barbell Row', sets: 4, reps: '6-8', rest: 120 },
                { name: 'Pull-Ups', sets: 4, reps: '8-10', rest: 90 },
                { name: 'Chest Row', sets: 3, reps: '10-12', rest: 60 },
                { name: 'DB Curl', sets: 3, reps: '8-10', rest: 60 },
                { name: 'Hammer Curls', sets: 3, reps: '10-12', rest: 60 },
                { name: 'Rear Delt Flyes', sets: 3, reps: '15-20', rest: 45 }
            ],
            'Lower B': [
                { name: 'Deadlift', sets: 4, reps: '5-6', rest: 180 },
                { name: 'Goblet Squat', sets: 3, reps: '8-10', rest: 120 },
                { name: 'Walking Lunges', sets: 3, reps: '12/leg', rest: 90 },
                { name: 'Leg Extensions', sets: 3, reps: '12-15', rest: 60 },
                { name: 'Hip Thrusts', sets: 4, reps: '10-12', rest: 60 },
                { name: 'Calf Raises', sets: 3, reps: '12-15', rest: 45 }
            ]
        };

        const schedule = [
            { day: 'Monday', workout: 'Upper A' },
            { day: 'Tuesday', workout: 'Lower A' },
            { day: 'Wednesday', workout: 'Rest' },
            { day: 'Thursday', workout: 'Upper B' },
            { day: 'Friday', workout: 'Lower B' },
            { day: 'Saturday', workout: 'Rest' },
            { day: 'Sunday', workout: 'Rest' }
        ];

        function getCycleInfo(lastPeriodDate) {
            if (!lastPeriodDate) return null;
            const today = new Date();
            const lastPeriod = new Date(lastPeriodDate);
            const daysDiff = Math.floor((today - lastPeriod) / (1000 * 60 * 60 * 24));
            const cycleDay = (daysDiff % 28) + 1;
            
            let phase, calories, trainingIntensity;
            
            if (cycleDay <= 5) {
                phase = 'Menstrual';
                calories = '2,150-2,200 kcal';
                trainingIntensity = '70-85% intensity';
            } else if (cycleDay <= 14) {
                phase = 'Follicular';
                calories = '2,100-2,150 kcal';
                trainingIntensity = '80-90% - PUSH FOR PRS!';
            } else if (cycleDay <= 17) {
                phase = 'Ovulation';
                calories = '2,150-2,200 kcal';
                trainingIntensity = '85-95% - GO FOR PRS!';
            } else {
                phase = 'Luteal';
                calories = '2,200-2,300 kcal';
                trainingIntensity = cycleDay <= 24 ? '80-90%' : '75-85%';
            }
            
            return { cycleDay, phase, calories, trainingIntensity };
        }

        function save() {
            localStorage.setItem('lastPeriod', state.lastPeriod);
            localStorage.setItem('weight', state.weight);
            localStorage.setItem('workoutLog', JSON.stringify(state.workoutLog));
            localStorage.setItem('prs', JSON.stringify(state.prs));
        }

        function startTimer(seconds) {
            state.timer = seconds;
            state.timerRunning = true;
            render();
            
            const interval = setInterval(() => {
                state.timer--;
                if (state.timer <= 0) {
                    clearInterval(interval);
                    state.timerRunning = false;
                }
                render();
            }, 1000);
        }

        function savePR(exercise) {
            if (state.prValue.trim()) {
                const cycleInfo = getCycleInfo(state.lastPeriod);
                state.prs[exercise] = {
                    value: state.prValue,
                    date: new Date().toISOString().split('T')[0],
                    phase: cycleInfo?.phase || 'Unknown'
                };
                state.editingPR = null;
                state.prValue = '';
                save();
                render();
            }
        }

        function completeWorkout() {
            const date = new Date().toISOString().split('T')[0];
            const cycleInfo = getCycleInfo(state.lastPeriod);
            state.workoutLog[date] = {
                workout: state.selectedWorkout,
                phase: cycleInfo?.phase || 'Unknown',
                note: state.note
            };
            state.selectedWorkout = null;
            state.note = '';
            state.timer = 0;
            state.timerRunning = false;
            save();
            render();
        }

        function render() {
            const app = document.getElementById('app');
            const cycleInfo = getCycleInfo(state.lastPeriod);
            const today = new Date().toLocaleDateString('en-US', { weekday: 'long' });
            const todayWorkout = schedule.find(d => d.day === today);

            let html = `
                <div class="text-center mb-6 pt-4">
                    <h1 class="text-3xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-2">
                        Body Recomp Tracker
                    </h1>
                    <p class="text-sm text-gray-600">Cycle-Synced Training</p>
                </div>
            `;

            // DASHBOARD
            if (state.tab === 'dashboard') {
                html += '<div class="space-y-6">';
                
                if (cycleInfo) {
                    html += `
                        <div class="bg-gradient-to-br from-pink-50 to-purple-50 rounded-xl p-6 border-2 border-pink-200">
                            <h2 class="text-2xl font-bold text-purple-900 mb-4">Cycle Day ${cycleInfo.cycleDay}</h2>
                            <div class="space-y-3">
                                <p class="text-lg font-semibold text-purple-800">${cycleInfo.phase} Phase</p>
                                <div class="pt-3 border-t border-purple-200">
                                    <p class="text-sm font-semibold text-gray-800 mb-1">Training:</p>
                                    <p class="text-sm text-gray-700">${cycleInfo.trainingIntensity}</p>
                                </div>
                                <div class="pt-2">
                                    <p class="text-sm font-semibold text-gray-800 mb-1">Calories:</p>
                                    <p class="text-sm text-gray-700">${cycleInfo.calories}</p>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="bg-yellow-50 rounded-xl p-6 border-2 border-yellow-200">
                            <p class="text-gray-700 mb-3">Set your last period date</p>
                            <input type="date" id="lastPeriodInput" value="${state.lastPeriod}" 
                                class="px-4 py-2 border-2 border-yellow-300 rounded-lg">
                        </div>
                    `;
                }

                if (todayWorkout) {
                    html += `
                        <div class="bg-white rounded-xl p-6 border-2 border-gray-200 shadow-sm">
                            <h2 class="text-xl font-bold mb-4">Today's Training</h2>
                            ${todayWorkout.workout === 'Rest' 
                                ? '<p class="text-center py-4 text-gray-600">Rest & Recovery Day</p>'
                                : `
                                    <p class="text-lg font-semibold text-blue-600 mb-3">${todayWorkout.workout}</p>
                                    <button onclick="selectWorkout('${todayWorkout.workout}')" 
                                        class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold">
                                        Start Workout
                                    </button>
                                `
                            }
                        </div>
                    `;
                }

                html += `
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white rounded-xl p-4 border-2 border-gray-200">
                            <p class="text-sm text-gray-600 mb-1">Weight</p>
                            <input type="number" id="weightInput" value="${state.weight}" step="0.1"
                                class="w-20 px-2 py-1 border-2 rounded"> kg
                        </div>
                        <div class="bg-white rounded-xl p-4 border-2 border-gray-200">
                            <p class="text-sm text-gray-600 mb-1">Protein</p>
                            <p class="text-2xl font-bold text-blue-600">130-145g</p>
                        </div>
                    </div>
                `;

                if (cycleInfo) {
                    html += `
                        <div class="bg-gradient-to-r from-green-50 to-blue-50 rounded-xl p-4 border-2 border-green-200">
                            <h3 class="font-semibold mb-2">💡 Nutrition (${cycleInfo.phase})</h3>
                            <p class="text-sm text-gray-700 mb-2">${cycleInfo.calories}</p>
                            <div class="text-sm space-y-1">
                                <p>• Protein: 130-145g (priority!)</p>
                                <p>• Carbs: 200-240g</p>
                                <p>• Fats: ${cycleInfo.phase === 'Luteal' ? '70-80g' : '55-65g'}</p>
                            </div>
                        </div>
                    `;
                }

                html += '</div>';
            }

            // WORKOUT
            else if (state.tab === 'workout') {
                if (state.selectedWorkout) {
                    html += '<div class="space-y-4">';
                    html += '<button onclick="backToSchedule()" class="text-blue-600 font-semibold">← Back to Schedule</button>';
                    
                    if (state.timerRunning) {
                        const mins = Math.floor(state.timer / 60);
                        const secs = state.timer % 60;
                        html += `
                            <div class="bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl p-4">
                                <div class="flex justify-between items-center">
                                    <span>Rest Timer</span>
                                    <div class="flex items-center gap-4">
                                        <span class="text-3xl font-bold">${mins}:${secs.toString().padStart(2, '0')}</span>
                                        <button onclick="stopTimer()" class="px-3 py-1 bg-white/20 rounded-lg">Stop</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    html += `
                        <div class="bg-white rounded-xl p-6 border-2 border-blue-200">
                            <h2 class="text-2xl font-bold mb-4">${state.selectedWorkout}</h2>
                            
                            <div class="mb-4 p-3 bg-yellow-50 rounded-lg border border-yellow-200">
                                <p class="text-sm font-semibold text-yellow-800 mb-2">Workout Notes</p>
                                <textarea id="noteInput" rows="3" 
                                    class="w-full px-3 py-2 border-2 border-yellow-300 rounded-lg text-sm"
                                    placeholder="How did you feel?">${state.note}</textarea>
                            </div>

                            <div class="space-y-3">
                    `;

                    workouts[state.selectedWorkout].forEach((ex, i) => {
                        html += `
                            <div class="p-4 bg-gray-50 rounded-lg border">
                                <div class="flex justify-between mb-2">
                                    <div class="flex-1">
                                        <p class="font-semibold">${ex.name}</p>
                                        <p class="text-sm text-gray-600">${ex.sets} sets × ${ex.reps} | Rest: ${ex.rest}s</p>
                                    </div>
                                    <div class="flex gap-2">
                                        <button onclick="startTimer(${ex.rest})" 
                                            class="px-3 py-1 bg-orange-100 text-orange-600 rounded-lg text-sm">
                                            ⏱️
                                        </button>
                                        <button onclick="editPR('${ex.name}')" 
                                            class="px-3 py-1 bg-yellow-100 text-yellow-600 rounded-lg text-sm">
                                            🏆
                                        </button>
                                    </div>
                                </div>
                        `;

                        if (state.editingPR === ex.name) {
                            html += `
                                <div class="flex gap-2 mt-2">
                                    <input type="text" id="prInput" value="${state.prValue}" 
                                        placeholder="e.g., 60kg × 8" 
                                        class="flex-1 px-3 py-2 border-2 border-yellow-300 rounded-lg text-sm">
                                    <button onclick="savePR('${ex.name}')" 
                                        class="px-3 py-2 bg-green-500 text-white rounded-lg text-sm">Save</button>
                                    <button onclick="cancelPR()" 
                                        class="px-3 py-2 bg-gray-300 rounded-lg text-sm">✕</button>
                                </div>
                            `;
                        } else if (state.prs[ex.name]) {
                            const pr = state.prs[ex.name];
                            html += `
                                <div class="mt-2 p-2 bg-yellow-50 rounded border border-yellow-200">
                                    <p class="text-xs text-yellow-700 font-semibold">PR</p>
                                    <p class="text-sm font-bold text-yellow-900">${pr.value}</p>
                                    <p class="text-xs text-gray-500">${new Date(pr.date).toLocaleDateString()} • ${pr.phase}</p>
                                </div>
                            `;
                        }

                        html += '</div>';
                    });

                    html += `
                            </div>
                            <button onclick="completeWorkout()" 
                                class="w-full mt-6 bg-green-600 text-white py-3 rounded-lg font-semibold">
                                ✓ Complete Workout
                            </button>
                        </div>
                    </div>
                    `;
                } else {
                    html += '<div><h2 class="text-2xl font-bold mb-4">Weekly Schedule</h2><div class="space-y-3">';
                    
                    schedule.forEach(day => {
                        const isToday = day.day === today;
                        html += `
                            <div class="p-4 rounded-xl border-2 ${isToday ? 'bg-blue-50 border-blue-300' : 'bg-white border-gray-200'}">
                                <div class="flex justify-between items-center">
                                    <div>
                                        <p class="font-bold">${day.day}</p>
                                        <p class="text-sm ${day.workout === 'Rest' ? 'text-gray-500' : 'text-blue-600 font-semibold'}">
                                            ${day.workout}
                                        </p>
                                    </div>
                                    ${day.workout !== 'Rest' ? `
                                        <button onclick="selectWorkout('${day.workout}')" 
                                            class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold">
                                            View
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    });

                    html += '</div></div>';
                }
            }

            // PROGRESS
            else if (state.tab === 'progress') {
                html += '<div class="space-y-6"><h2 class="text-2xl font-bold">Progress Tracker</h2>';
                
                html += `
                    <div class="bg-gradient-to-br from-yellow-50 to-orange-50 rounded-xl p-6 border-2 border-yellow-200">
                        <h3 class="text-lg font-bold text-yellow-900 mb-4">🏆 Personal Records</h3>
                `;
                
                const prEntries = Object.entries(state.prs);
                if (prEntries.length === 0) {
                    html += '<p class="text-sm text-gray-600">No PRs yet!</p>';
                } else {
                    html += '<div class="space-y-3">';
                    prEntries.forEach(([ex, rec]) => {
                        html += `
                            <div class="bg-white rounded-lg p-4 border border-yellow-200">
                                <p class="font-semibold text-sm">${ex}</p>
                                <p class="text-lg font-bold text-yellow-600">${rec.value}</p>
                                <p class="text-xs text-gray-500">${new Date(rec.date).toLocaleDateString()} • ${rec.phase}</p>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                
                html += '</div>';

                html += `
                    <div class="bg-white rounded-xl p-6 border-2 border-gray-200">
                        <h3 class="text-lg font-bold mb-3">Workout History</h3>
                `;

                const logEntries = Object.entries(state.workoutLog).reverse().slice(0, 10);
                if (logEntries.length === 0) {
                    html += '<p class="text-sm text-gray-500">No workouts logged yet</p>';
                } else {
                    html += '<div class="space-y-3">';
                    logEntries.forEach(([date, log]) => {
                        html += `
                            <div class="p-4 bg-gray-50 rounded-lg border">
                                <div class="flex justify-between items-center mb-2">
                                    <div>
                                        <p class="font-semibold text-sm">${log.workout}</p>
                                        <p class="text-xs text-gray-500">${new Date(date).toLocaleDateString()}</p>
                                        <p class="text-xs text-purple-600">${log.phase} Phase</p>
                                    </div>
                                    <span class="text-green-500 text-xl">✓</span>
                                </div>
                                ${log.note ? `
                                    <div class="mt-2 p-2 bg-yellow-50 rounded border border-yellow-200">
                                        <p class="text-xs font-semibold text-yellow-700">Notes:</p>
                                        <p class="text-xs text-gray-700">${log.note}</p>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                html += '</div></div>';
            }

            // BOTTOM NAV
            html += `
                <div class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-gray-200 shadow-lg">
                    <div class="max-w-2xl mx-auto flex justify-around py-3">
                        <button onclick="setTab('dashboard')" class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg ${state.tab === 'dashboard' ? 'tab-active' : ''}">
                            <span class="text-2xl">📈</span>
                            <span class="text-xs font-semibold">Dashboard</span>
                        </button>
                        <button onclick="setTab('workout')" class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg ${state.tab === 'workout' ? 'tab-active' : ''}">
                            <span class="text-2xl">💪</span>
                            <span class="text-xs font-semibold">Workout</span>
                        </button>
                        <button onclick="setTab('progress')" class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg ${state.tab === 'progress' ? 'tab-active' : ''}">
                            <span class="text-2xl">📅</span>
                            <span class="text-xs font-semibold">Progress</span>
                        </button>
                    </div>
                </div>
            `;

            app.innerHTML = html;

            // Attach event listeners
            const periodInput = document.getElementById('lastPeriodInput');
            if (periodInput) {
                periodInput.addEventListener('change', (e) => {
                    state.lastPeriod = e.target.value;
                    save();
                    render();
                });
            }

            const weightInput = document.getElementById('weightInput');
            if (weightInput) {
                weightInput.addEventListener('change', (e) => {
                    state.weight = e.target.value;
                    save();
                    render();
                });
            }

            const noteInput = document.getElementById('noteInput');
            if (noteInput) {
                noteInput.addEventListener('input', (e) => {
                    state.note = e.target.value;
                });
            }

            const prInput = document.getElementById('prInput');
            if (prInput) {
                prInput.addEventListener('input', (e) => {
                    state.prValue = e.target.value;
                });
            }
        }

        // Global functions
        function setTab(tab) {
            state.tab = tab;
            render();
        }

        function selectWorkout(workout) {
            state.selectedWorkout = workout;
            state.tab = 'workout';
            render();
        }

        function backToSchedule() {
            state.selectedWorkout = null;
            state.timer = 0;
            state.timerRunning = false;
            render();
        }

        function stopTimer() {
            state.timer = 0;
            state.timerRunning = false;
            render();
        }

        function editPR(exercise) {
            state.editingPR = exercise;
            state.prValue = state.prs[exercise]?.value || '';
            render();
        }

        function cancelPR() {
            state.editingPR = null;
            state.prValue = '';
            render();
        }

        // Initial render
        render();
    </script>
</body>
</html>
